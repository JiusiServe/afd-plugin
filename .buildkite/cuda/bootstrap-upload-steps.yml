# Uploaded by upload_pipeline.py --upload (not the Buildkite hook).
# ``if`` is injected by step ``key`` from skip-ci at upload time.
# Slimmed for afd-plugin: ready (L2) + merge (L3) only.
steps:
  - label: ":docker: Build image"
    key: image-build
    commands:
      - "bash .buildkite/cuda/scripts/build-ci-image.sh"
    agents:
      queue: "cpu_queue_premerge"

  # L2 Test — PR ready label (diff-aware)
  - label: "Upload Ready Pipeline"
    depends_on: image-build
    key: upload-ready-pipeline
    commands:
      - python3 .buildkite/common/scripts/upload_pipeline.py --upload .buildkite/cuda/test-ready.yml
    agents:
      queue: "cpu_queue_premerge"

  # L3 Test — PR merge-test label or main
  - label: "Upload Merge Pipeline"
    depends_on: image-build
    key: upload-merge-pipeline
    commands:
      - python3 .buildkite/common/scripts/upload_pipeline.py --upload .buildkite/cuda/test-merge.yml
    agents:
      queue: "cpu_queue_premerge"
