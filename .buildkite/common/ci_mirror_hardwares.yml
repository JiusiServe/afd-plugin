            containers:
              - image: public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:$BUILDKITE_COMMIT
                resources:
                  limits:
                    nvidia.com/gpu: 2
                  requests:
                    nvidia.com/gpu: 2
                    cpu: "20"
                    memory: 80Gi
                volumeMounts:
                  - name: devshm
                    mountPath: /dev/shm
                  - name: hf-cache
                    mountPath: /fsx/hf_cache
                env:
                  - name: HF_HOME
                    value: /fsx/hf_cache
                  - name: HF_HUB_DISABLE_XET
                    value: "1"
                  - name: HF_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: hf-token-secret
                        key: token
            volumes:
              - name: devshm
                emptyDir:
                  medium: Memory
                  sizeLimit: 48Gi
              - name: hf-cache
                hostPath:
                  path: /fsx/hf_cache
