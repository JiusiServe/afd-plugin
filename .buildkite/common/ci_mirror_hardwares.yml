# Uploader-only hardware presets for CUDA test YAML.
# Referenced as ``mirror_hardwares: l4_1`` on a step; ``upload_pipeline.py`` expands to
# ``agents`` + ``plugins``, then strips ``mirror_hardwares`` before Buildkite upload.
#
# CUDA naming: {chip}_{count}
#   l4_1, l4_2, l4_3, l4_4, h100_4

# Infra-only retry. Omit exit 1 (pytest failed) and 137 (cgroup OOM / SIGKILL
# of the test process). ci-infra ``K8S_RETRY`` still retries exit 1.
x-l4-k8s-retry: &l4_k8s_retry
  automatic:
    - exit_status: -1
      limit: 1
    - exit_status: 128
      limit: 1
    - signal_reason: agent_stop
      limit: 1
    - signal_reason: agent_refused
      limit: 1

mirror_hardwares:
  l4_1:
    agents:
      queue: l4-k8s
    retry: *l4_k8s_retry
    plugins:
      - kubernetes:
          metadata:
            annotations:
              cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
              karpenter.sh/do-not-disrupt: "true"
          podSpec:
            priorityClassName: ci
            serviceAccountName: buildkite-gpu-jobs
            tolerations:
              - key: nvidia.com/gpu
                operator: Exists
                effect: NoSchedule
            nodeSelector:
              vllm.ci/gpu-pool: l4x4
            containers:
              - image: public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:$BUILDKITE_COMMIT
                resources:
                  limits:
                    nvidia.com/gpu: 1
                  requests:
                    nvidia.com/gpu: 1
                    cpu: "10"
                    memory: 40Gi
                volumeMounts:
                  - name: devshm
                    mountPath: /dev/shm
                  - name: hf-cache
                    mountPath: /fsx/hf_cache
                env:
                  - name: HF_HOME
                    value: /fsx/hf_cache
                  - name: HF_HUB_DISABLE_XET
                    value: "1"
                  - name: HF_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: hf-token-secret
                        key: token
            volumes:
              - name: devshm
                emptyDir:
                  medium: Memory
                  sizeLimit: 24Gi
              - name: hf-cache
                hostPath:
                  path: /fsx/hf_cache
                  type: DirectoryOrCreate

  l4_2:
    agents:
      queue: l4-k8s
    retry: *l4_k8s_retry
    plugins:
      - kubernetes:
          metadata:
            annotations:
              cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
