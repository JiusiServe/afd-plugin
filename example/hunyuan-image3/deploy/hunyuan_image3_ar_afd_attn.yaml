# HunyuanImage-3.0-Instruct AR-only deploy for AFD ATTN server.
#
pipeline: hunyuan_image3_ar
async_chunk: false

stages:
  - stage_id: 0
    worker_cls: "afd_plugin.v1.worker.AFDAttentionWorker"
    max_num_seqs: 1
    gpu_memory_utilization: 0.75
    trust_remote_code: true
    enforce_eager: true
    enable_expert_parallel: true
    enable_prefix_caching: false
    max_num_batched_tokens: 32768
    devices: "0,1"
    tensor_parallel_size: 2
    hf_overrides:
      rope_parameters:
        mrope_section: [0, 32, 32]
        rope_type: default
    default_sampling_params:
      temperature: 0.0
      top_p: 0.95
      top_k: 1024
      max_tokens: 1024
      detokenize: true

