apiVersion: v1
kind: Pod
metadata:
  name: inference-perf
  labels:
    app: inference-perf
spec:
  containers:
    - name: inference-perf
      image: quay.io/inference-perf/inference-perf:latest
      imagePullPolicy: Always
      command: ["inference-perf"]
      args: ["--config_file", "/etc/config/config.yml"]
      env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token-secret
              key: token
              optional: true
        - name: HF_HOME
          value: /reports/.cache/huggingface
      volumeMounts:
        - name: config-volume
          mountPath: /etc/config
          readOnly: true
        - name: reports-volume
          mountPath: /reports
  restartPolicy: Never
  volumes:
    - name: config-volume
      configMap:
        name: inference-perf-config
    - name: reports-volume
      persistentVolumeClaim:
        claimName: inference-perf-reports
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inference-perf-reports
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
