apiVersion: v1
kind: ConfigMap
metadata:
  name: afd-model-config
  labels:
    app: afd-recipe
data:
  # HF hub id. run.sh always serves this directly (`vllm serve` defaults the
  # served model name to whatever id it's given, so this also doubles as the
  # model_name clients must request), and it's what vLLM downloads into the
  # PVC's HF_HOME cache on a cold volume.
  MODEL_ID: "deepseek-ai/DeepSeek-V2-Lite"
