apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-perf-config
data:
  config.yml: |
    # inference-perf configuration for the AFD DeepSeek-V2-Lite
    # prefill/decode-disaggregation recipe (see
    # ../../../../recipe/gpu/P2pNcclAFDConnector/kubernetes/serve-bench-pod.yaml),
    # reached through the vllm-service Service (see
    # ../../../../recipe/gpu/P2pNcclAFDConnector/kubernetes/service-route.yaml).
    # server.model_name and tokenizer.pretrained_model_name_or_path are both
    # templated from the afd-model-config ConfigMap's MODEL_ID (see
    # deepseek-v2-lite-model-config.yaml) by run.sh at apply time -- the
    # serve pod always serves MODEL_ID (`vllm serve` defaults the served
    # model name to whatever string it's given), so this is the name clients
    # must request, and doubles as the tokenizer's
    # pretrained_model_name_or_path. inference-perf's Config schema forbids
    # extra top-level fields, so this can't be a top-level YAML anchor -- the
    # value is inlined below instead.
    load:
      type: poisson
      interval: 60.0
      num_workers: 16
      stages:
        - rate: 5
          duration: 60
        - rate: 10
          duration: 60
        - rate: 15
          duration: 60
        - rate: 20
          duration: 60
        - rate: 25
          duration: 60
        - rate: 30
          duration: 60
        - rate: 35
          duration: 60
        - rate: 40
          duration: 60

    api:
      type: completion
      streaming: true

    server:
      type: vllm
      model_name: ${MODEL_ID}
      base_url: http://vllm-service:18305
      ignore_eos: true

    tokenizer:
      pretrained_model_name_or_path: ${MODEL_ID}

    data:
      type: shared_prefix
      shared_prefix:
        num_groups: 250
        num_prompts_per_group: 5
        system_prompt_len: 7000
        question_len: 256
        output_len: 256
        enable_multi_turn_chat: false

    report:
      request_lifecycle:
        summary: true
        per_stage: true
        per_request: false

    storage:
      local_storage:
        path: /reports
