apiVersion: v1
kind: Pod
metadata:
  name: afd-deepseek-v2-lite-serve-bench
  labels:
    app: afd-recipe
    role: serve-bench
spec:
  restartPolicy: Never
  securityContext:
    fsGroup: 1003810000
  volumes:
    - name: model-storage
      persistentVolumeClaim:
        claimName: deepseek-v2-lite-pvc
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
    - name: work
      emptyDir: {}
  containers:
    - name: afd
      image: ${TEMPLATE_IMAGE}
      imagePullPolicy: Always
      command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          RESULT_DIR=/models/results
          DONE=/work/BENCH_DONE
          REPO=/opt/afd-plugin
          rm -rf "$RESULT_DIR"
          mkdir -p "$RESULT_DIR"
          cd "$REPO"

          REAL_UV="$(command -v uv)"
          mkdir -p /work/bin
          printf '#!/bin/bash\nif [ "$1" = "run" ]; then\n  shift\n  exec "$@"\nfi\nexec "%s" "$@"\n' "$REAL_UV" > /work/bin/uv
          chmod +x /work/bin/uv
          export PATH="/work/bin:$PATH"

          echo "=== [1/2] launch recipe ==="
          export MODEL_PATH=/models/DeepSeek-V2-Lite
          export VLLM_USE_V2_MODEL_RUNNER=0
          export LOG_DIR=/work
          RECIPE="${TEMPLATE_RECIPE}" bash "$REPO"/tools/benchmarks/decode_bench_server.sh &
          RECIPE_PID=$!

          echo "=== waiting for server startup (/work/attn.log) ==="
          for i in $(seq 1 120); do
            if [ -f /work/attn.log ] && grep -q "Application startup complete" /work/attn.log; then
              echo "server ready"
              break
            fi
            if ! kill -0 "$RECIPE_PID" 2>/dev/null; then
              echo "ERROR: recipe process exited before startup"
              tail -n 200 /work/attn.log /work/ffn.log 2>/dev/null || true
              touch "$DONE"
              sleep infinity
            fi
            sleep 10
          done

          echo "=== [2/2] run benchmark rate ladder (request_generator.sh) ==="
          set +e
          BENCH_RC=0
          RESULT_FILENAME="${TEMPLATE_RESULT_PREFIX}.json"
          MODEL_PATH=/models/DeepSeek-V2-Lite \
          HOST=127.0.0.1 PORT=18305 \
          RESULT_DIR="$RESULT_DIR" RESULT_FILENAME="$RESULT_FILENAME" \
          bash tools/benchmarks/request_generator.sh
          RC=$?
          [ "$RC" -ne 0 ] && BENCH_RC=$RC
          set -e
          echo "benchmark exited rc=$BENCH_RC"
          cp -f /work/attn.log /work/ffn.log "$RESULT_DIR"/ 2>/dev/null || true
          echo "$BENCH_RC" > "$RESULT_DIR/bench_rc.txt"

          echo "=== benchmark finished; results in $RESULT_DIR ==="
          ls -la "$RESULT_DIR"
          touch "$DONE"
          echo "=== pod staying alive for result copy; delete pod when done ==="
          sleep infinity
      env:
        - name: USER
          value: "vllm"
        - name: HOME
          value: "/work/home"
        - name: HF_HOME
          value: "/models/.hf_home"
        - name: XDG_CACHE_HOME
          value: "/work/xdg"
        - name: TORCHINDUCTOR_CACHE_DIR
          value: "/work/inductor"
        - name: TRITON_CACHE_DIR
          value: "/work/triton"
        - name: VLLM_CACHE_ROOT
          value: "/work/vllm"
        - name: UV_CACHE_DIR
          value: "/work/uv"
        - name: VLLM_LOGGING_LEVEL
          value: "INFO"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token-secret
              key: token
      resources:
        requests:
          nvidia.com/gpu: "4"
          cpu: "16"
          memory: 128Gi
        limits:
          nvidia.com/gpu: "4"
          cpu: "32"
          memory: 200Gi
      volumeMounts:
        - name: model-storage
          mountPath: /models
        - name: dshm
          mountPath: /dev/shm
        - name: work
          mountPath: /work
