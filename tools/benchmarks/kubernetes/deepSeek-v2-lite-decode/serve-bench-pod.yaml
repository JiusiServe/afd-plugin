apiVersion: v1
kind: Pod
metadata:
  name: afd-deepseek-v2-lite-serve-bench
  labels:
    app: afd-recipe
    role: serve-bench
spec:
  restartPolicy: Never
  securityContext:
    fsGroup: 1003810000
  volumes:
    - name: model-storage
      persistentVolumeClaim:
        claimName: deepseek-v2-lite-pvc
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
    - name: work
      emptyDir: {}
  containers:
    - name: afd
      image: ${TEMPLATE_IMAGE}
      imagePullPolicy: Always
      command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          RESULT_DIR=/models/results
          DONE=/work/BENCH_DONE
          REPO=/opt/afd-plugin
          rm -rf "$RESULT_DIR"
          mkdir -p "$RESULT_DIR"
          cd "$REPO"

          echo "=== fetch dcgmi client (must match cluster DCGM host-engine 4.4.2) ==="
          mkdir -p /work/dcgm
          if curl -fsSL -o /work/dcgm/dcgm.deb \
            "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2204/x86_64/datacenter-gpu-manager-4-core_4.4.2-1_amd64.deb"; then
            dpkg-deb -x /work/dcgm/dcgm.deb /work/dcgm/extract
            export PATH="/work/dcgm/extract/usr/bin:$PATH"
            export LD_LIBRARY_PATH="/work/dcgm/extract/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          else
            echo "WARNING: could not fetch dcgmi client; DCGM profiling will be skipped"
          fi

          echo "=== per-GPU DCGM profiling (tensor core / SM / DRAM activity) ==="
          # 1002 SM_ACTIVE, 1003 SM_OCCUPANCY, 1004 PIPE_TENSOR_ACTIVE, 1005
          # DRAM_ACTIVE, 1013/1014/1015 tensor core INT8/FP16/FP64 active. The
          # cluster's DCGM host-engine pods aren't on hostNetwork, so they're
          # only reachable at their own pod IP (not the node's hostIP); run.sh
          # resolves the host-engine pod on our node and drops its IP in
          # /work/DCGM_HOST_IP right after the pod reaches Running; wait
          # briefly here in case that write hasn't landed yet.
          for i in $(seq 1 30); do
            [ -f /work/DCGM_HOST_IP ] && break
            sleep 1
          done
          DCGM_HOST_ARGS=()
          [ -f /work/DCGM_HOST_IP ] && DCGM_HOST_ARGS=(--host "$(cat /work/DCGM_HOST_IP)")
          if command -v dcgmi >/dev/null 2>&1 && [ "${#DCGM_HOST_ARGS[@]}" -gt 0 ]; then
            dcgmi dmon "${DCGM_HOST_ARGS[@]}" -e 1002,1003,1004,1005,1013,1014,1015 -d 1000 > /work/dcgm.log 2>&1 &
            DCGM_PID=$!
          else
            echo "dcgmi not found or DCGM host-engine unresolved; skipping DCGM profiling" > /work/dcgm.log
          fi

          echo "=== [1/2] launch recipe ==="
          export MODEL_PATH=/models/DeepSeek-V2-Lite
          export VLLM_USE_V2_MODEL_RUNNER=0
          export LOG_DIR=/work
          RECIPE="${TEMPLATE_RECIPE}" bash "$REPO"/tools/benchmarks/decode_bench_server.sh &
          RECIPE_PID=$!

          echo "=== waiting for server startup (/work/attn.log) ==="
          for i in $(seq 1 120); do
            if [ -f /work/attn.log ] && grep -q "Application startup complete" /work/attn.log; then
              echo "server ready"
              break
            fi
            if ! kill -0 "$RECIPE_PID" 2>/dev/null; then
              echo "ERROR: recipe process exited before startup"
              tail -n 200 /work/attn.log /work/ffn.log 2>/dev/null || true
              touch "$DONE"
              sleep infinity
            fi
            sleep 10
          done

          echo "=== [2/2] run benchmark rate ladder (request_generator.sh) ==="
          set +e
          BENCH_RC=0
          RESULT_FILENAME="${TEMPLATE_RESULT_PREFIX}.json"
          MODEL_PATH=/models/DeepSeek-V2-Lite \
          HOST=127.0.0.1 PORT=18305 \
          RESULT_DIR="$RESULT_DIR" RESULT_FILENAME="$RESULT_FILENAME" \
          bash tools/benchmarks/request_generator.sh
          RC=$?
          [ "$RC" -ne 0 ] && BENCH_RC=$RC
          set -e
          echo "benchmark exited rc=$BENCH_RC"
          [ -n "${DCGM_PID:-}" ] && kill "$DCGM_PID" 2>/dev/null || true
          cp -f /work/attn.log /work/ffn.log /work/dcgm.log "$RESULT_DIR"/ 2>/dev/null || true
          echo "$BENCH_RC" > "$RESULT_DIR/bench_rc.txt"

          echo "=== benchmark finished; results in $RESULT_DIR ==="
          ls -la "$RESULT_DIR"
          touch "$DONE"
          echo "=== pod staying alive for result copy; delete pod when done ==="
          sleep infinity
      env:
        - name: USER
          value: "vllm"
        - name: HOME
          value: "/work/home"
        - name: HF_HOME
          value: "/models/.hf_home"
        - name: XDG_CACHE_HOME
          value: "/work/xdg"
        - name: TORCHINDUCTOR_CACHE_DIR
          value: "/work/inductor"
        - name: TRITON_CACHE_DIR
          value: "/work/triton"
        - name: VLLM_CACHE_ROOT
          value: "/work/vllm"
        - name: UV_CACHE_DIR
          value: "/work/uv"
        - name: VLLM_LOGGING_LEVEL
          value: "INFO"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token-secret
              key: token
      resources:
        requests:
          nvidia.com/gpu: "4"
          cpu: "16"
          memory: 128Gi
        limits:
          nvidia.com/gpu: "4"
          cpu: "32"
          memory: 200Gi
      volumeMounts:
        - name: model-storage
          mountPath: /models
        - name: dshm
          mountPath: /dev/shm
        - name: work
          mountPath: /work
