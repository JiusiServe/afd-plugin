# SPDX-License-Identifier: Apache-2.0
name: CPU-only CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      AFD_BUILD_ASCEND_OPS: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --locked --group dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Validate GitHub issue templates
        run: |
          ruby -e 'require "yaml"; Dir[".github/ISSUE_TEMPLATE/*.yml"].each { |f| YAML.load_file(f); puts "ok #{f}" }'

  cpu-tests:
    runs-on: ubuntu-latest
    env:
      AFD_BUILD_ASCEND_OPS: "0"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --locked --group dev

      - name: Frozen NPU ModelRunner contracts
        if: matrix.python-version == '3.10'
        run: |
          uv run pytest -q \
            tests/unit/compat/test_ascend_version.py \
            tests/unit/tools/test_snapshot_npu_model_runner_contract.py \
            tests/unit/v1/worker/test_npu_model_runner_contract.py \
            tests/unit/v1/worker/test_npu_model_runner_phase1_structure.py \
            tests/unit/v1/worker/test_npu_model_runner_phase2.py \
            tests/unit/v1/worker/test_npu_ubatch_plan_phase3.py \
            tests/unit/v1/worker/test_npu_attention_metadata_phase4.py \
            tests/unit/v1/worker/test_npu_graph_capture_phase6.py \
            tests/unit/v1/worker/test_npu_model_runner_phase7.py \
            -m "not vllm_runtime"

      - name: CPU-only unit tests
        run: uv run pytest -q tests/unit -m "not gpu and not vllm_runtime"
