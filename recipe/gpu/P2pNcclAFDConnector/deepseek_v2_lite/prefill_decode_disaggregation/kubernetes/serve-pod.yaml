# 2P1A1F prefill/decode-disaggregation serving pod.
#
# This pod brings the stack UP and holds it there, serving on 127.0.0.1:18305
# until it is deleted. Drive traffic into it with `kubectl exec` or
# `kubectl port-forward` (see README.md).
#
# All five processes of the recipe run inside this one Pod on 127.0.0.1, which
# is what 2p1a1f_graph_dbo.sh already assumes:
#
#   GPU0  prefill #0  :18301   NixlConnector kv_producer, side channel 5601
#   GPU1  prefill #1  :18302   NixlConnector kv_producer, side channel 5602
#   GPU2  attention   :18303   NixlConnector kv_consumer, side channel 5603
#   GPU3  ffn         :18304   AFD p2p to attention on 6269
#    --   proxy       :18305   client-facing endpoint, send traffic here
#
# Not applied directly: render it with `envsubst` first, naming the three
# variables explicitly so every other $VAR survives for the in-pod shell:
#
#   envsubst '${TEMPLATE_IMAGE} ${TEMPLATE_MODEL} ${TEMPLATE_RECIPE_SCRIPT}' \
#     < serve-pod.yaml | kubectl apply -f -
#
# Readiness markers written into the pod:
#   /work/SERVER_READY   all four servers up and the proxy answering
#   /work/SERVER_FAILED  bring-up failed; per-worker logs already dumped
apiVersion: v1
kind: Pod
metadata:
  name: afd-dsv2lite-pd-1a1f
  labels:
    app: afd-recipe
    role: pd-serve
    topology: 2p1a1f
spec:
  restartPolicy: Never
  # The model PVC is backed by IBM Spectrum Scale, whose CSI driver is only
  # installed on a subset of the GPU nodes. The GPU request alone does not
  # express that, so the scheduler will happily pick a driverless node, where
  # the volume then fails to attach with "CSINode <node> does not contain
  # driver spectrumscale.csi.ibm.com" -- the pod sits in ContainerCreating,
  # holding its 4-GPU reservation, until it is torn down.
  #
  # `scale=true` is a strict subset of the nodes carrying the driver, so it
  # never selects a node that cannot mount the volume.
  nodeSelector:
    scale: "true"
  # No imagePullSecrets: the image is published public. GHCR creates packages
  # private, so if the visibility flip was missed the pod sits in
  # ImagePullBackOff holding its 4-GPU reservation -- add an imagePullSecrets
  # entry here (or make the package public) if that happens.
  volumes:
    # Hugging Face cache: cold on first run, warm on every run after.
    - name: model-storage
      persistentVolumeClaim:
        claimName: deepseek-v2-lite-pvc
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
    - name: work
      emptyDir: {}
  containers:
    - name: afd
      image: ${TEMPLATE_IMAGE}
      imagePullPolicy: Always
      command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          REPO=/opt/afd-plugin
          RECIPE_DIR="$REPO/recipe/gpu/P2pNcclAFDConnector/deepseek_v2_lite/prefill_decode_disaggregation"
          RECIPE_SCRIPT="$RECIPE_DIR/$AFD_RECIPE_SCRIPT"
          READY=/work/SERVER_READY
          FAILED=/work/SERVER_FAILED

          # HF_HOME points at the PVC (see env below), so on a cold volume vLLM
          # downloads the weights on first use and every later run starts warm.
          export MODEL_PATH="$AFD_MODEL"

          # /work/home is HOME (see env below); nothing else creates it,
          # and tools that expand ~ fail on a missing home directory.
          mkdir -p /work/results /work/bin /work/home

          # The recipe script invokes `uv run vllm` / `uv run python`, which is
          # right for a local uv checkout but wrong here: this image installs
          # vllm and afd-plugin into the system Python and has no uv project,
          # so `uv run` would try to sync one and fail. Rather than editing (or
          # forking) the recipe, shadow `uv` with a shim that drops the
          # `run` verb -- the recipe script then stays byte-identical to what a
          # local user runs. docker/Dockerfile.k8s-bench solves the same problem
          # for tools/benchmarks/* with a build-time sed.
          cat > /work/bin/uv <<'SHIM'
          #!/usr/bin/env bash
          [ "${1:-}" = "run" ] && shift
          exec "$@"
          SHIM
          chmod +x /work/bin/uv
          export PATH="/work/bin:$PATH"

          # The recipe script writes its per-worker logs to the CWD.
          cd /work

          echo "=== launch 2P1A1F recipe: $AFD_RECIPE_SCRIPT (model: $MODEL_PATH) ==="
          bash "$RECIPE_SCRIPT" &
          RECIPE_PID=$!

          # Dump diagnostics and park rather than hanging silently: the pod
          # stays inspectable and /work/SERVER_FAILED marks the outcome.
          fail() {
            echo "ERROR: $*"
            for log in afd_prefill0.log afd_prefill1.log attn.log ffn.log proxy.log; do
              echo "----- tail $log -----"
              tail -n 100 "/work/$log" 2>/dev/null || echo "(missing)"
            done
            touch "$FAILED"
            sleep infinity
          }

          echo "=== wait for all four vLLM instances to report startup ==="
          # Graph capture on four instances is slow, and a cold HF cache adds a
          # one-time model download; allow 40 minutes per instance.
          #
          # The FFN worker needs a DIFFERENT marker from the other three. It is
          # driven purely through the AFD attention<->FFN p2p connector and
          # never serves HTTP (nothing ever listens on its --port 18304), so it
          # does not run the API-server startup path and never logs
          # "Application startup complete". Waiting for that string here would
          # hang until the timeout even though the stack is fully working.
          ready_marker() {
            case "$1" in
              ffn.log) echo "AFD FFN EngineCore started" ;;
              *)       echo "Application startup complete" ;;
            esac
          }
          for log in afd_prefill0.log afd_prefill1.log attn.log ffn.log; do
            marker="$(ready_marker "$log")"
            echo "--- waiting on $log (marker: $marker) ---"
            ready=0
            for i in $(seq 1 240); do
              if [ -f "/work/$log" ] && grep -q "$marker" "/work/$log"; then
                echo "$log: ready"
                ready=1
                break
              fi
              if ! kill -0 "$RECIPE_PID" 2>/dev/null; then
                fail "recipe process exited before $log came up"
              fi
              sleep 10
            done
            [ "$ready" = "1" ] || fail "timed out waiting for $log"
          done

          echo "--- waiting on proxy /healthcheck (127.0.0.1:18305) ---"
          proxy_ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18305/healthcheck >/dev/null 2>&1; then
              echo "proxy: ready"
              proxy_ready=1
              break
            fi
            sleep 5
          done
          [ "$proxy_ready" = "1" ] || fail "proxy did not answer /healthcheck"

          touch "$READY"
          echo "=== stack READY; drive load at 127.0.0.1:18305 ==="
          sleep infinity
      env:
        # Substituted by envsubst before apply (see the header).
        - name: AFD_MODEL
          value: "${TEMPLATE_MODEL}"
        - name: AFD_RECIPE_SCRIPT
          value: "${TEMPLATE_RECIPE_SCRIPT}"
        - name: USER
          value: "vllm"
        - name: HOME
          value: "/work/home"
        - name: HF_HOME
          value: "/models/.hf_home"
        # Keep the Xet chunk cache on the PVC too; it defaults under HOME,
        # which is an emptyDir here and would be thrown away with the pod.
        - name: HF_XET_CACHE
          value: "/models/.hf_xet"
        - name: XDG_CACHE_HOME
          value: "/work/xdg"
        - name: TORCHINDUCTOR_CACHE_DIR
          value: "/work/inductor"
        - name: TRITON_CACHE_DIR
          value: "/work/triton"
        - name: VLLM_CACHE_ROOT
          value: "/work/vllm"
        - name: UV_CACHE_DIR
          value: "/work/uv"
        - name: VLLM_LOGGING_LEVEL
          value: "INFO"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token-secret
              key: token
      resources:
        requests:
          nvidia.com/gpu: "4"
          cpu: "16"
          memory: 128Gi
        limits:
          nvidia.com/gpu: "4"
          cpu: "32"
          memory: 200Gi
      volumeMounts:
        - name: model-storage
          mountPath: /models
        - name: dshm
          mountPath: /dev/shm
        - name: work
          mountPath: /work
