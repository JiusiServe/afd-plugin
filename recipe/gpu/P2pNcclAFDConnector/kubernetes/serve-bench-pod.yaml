apiVersion: v1
kind: Pod
metadata:
  name: vllm-pod
  labels:
    app: afd-recipe
    role: serve
spec:
  restartPolicy: Never
  securityContext:
    fsGroup: 1003810000
  volumes:
    - name: model-storage
      persistentVolumeClaim:
        claimName: model-pvc
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
    - name: work
      emptyDir: {}
  containers:
    - name: afd
      image: ${TEMPLATE_IMAGE}
      imagePullPolicy: Always
      command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          REPO=/opt/afd-plugin
          RECIPE_SCRIPT="$REPO/${RECIPE_SCRIPT_PATH}"
          REAL_UV="$(command -v uv)"
          mkdir -p /work/bin
          printf '#!/bin/bash\nif [ "$1" = "run" ]; then\n  shift\n  exec "$@"\nfi\nexec "%s" "$@"\n' "$REAL_UV" > /work/bin/uv
          chmod +x /work/bin/uv
          export PATH="/work/bin:$PATH"

          echo "=== launching $(basename "$RECIPE_SCRIPT") recipe ==="
          export VLLM_USE_V2_MODEL_RUNNER=0

          # :18305 is the client-facing port in every recipe, but who binds it
          # varies -- the proxy in disaggregation, the attention server itself
          # in colocation (which has no proxy at all) -- while every internal
          # worker (prefill/attn/ffn-to-ffn, or attn/ffn in colocation) listens
          # on a different port or, for the FFN role, never starts an HTTP
          # server at all. Rebind whichever `--host 127.0.0.1` line precedes a
          # `--port 18305` line, so both recipe families get exposed off-pod
          # without special-casing either one.
          # $REPO is read-only here (this pod runs as a non-root UID that
          # doesn't own it), so the patched copy can't be written next to the
          # original. Mirror just enough of the repo under /work (which IS
          # writable) to keep the recipe's own SCRIPT_DIR-relative
          # "../../../../../tools/proxy_server.py" lookup resolving: a
          # symlink for tools/, plus the recipe's own subdirectory, at the
          # same relative depth.
          RECIPE_BASENAME="$(basename "$RECIPE_SCRIPT" .sh)"
          RECIPE_REL="${RECIPE_SCRIPT#$REPO/}"
          MIRROR=/work/repo-mirror
          mkdir -p "$MIRROR/$(dirname "$RECIPE_REL")"
          ln -sfn "$REPO/tools" "$MIRROR/tools"
          PATCHED_SCRIPT="$MIRROR/$(dirname "$RECIPE_REL")/${RECIPE_BASENAME}.patched.sh"
          awk '
            { line[NR] = $0 }
            END {
              for (i = 1; i <= NR; i++) {
                l = line[i]
                if (l ~ /--host 127\.0\.0\.1/ && i < NR && line[i+1] ~ /--port 18305/) {
                  gsub(/127\.0\.0\.1/, "0.0.0.0", l)
                }
                print l
              }
            }' "$RECIPE_SCRIPT" > "$PATCHED_SCRIPT"

          cd /work
          bash "$PATCHED_SCRIPT" &
          RECIPE_PID=$!

          # Each worker in every recipe redirects to its own log ('> attn.log'),
          # so the redirects ARE the process list: colocation yields
          # "attn.log ffn.log", disaggregation adds the two prefillers and the
          # proxy. Read from the original (unpatched) script since the --host
          # rewrite above doesn't touch the redirects.
          LOGS="$(grep -oE '>[[:space:]]*[A-Za-z0-9_]+\.log' "$RECIPE_SCRIPT" \
                  | grep -oE '[A-Za-z0-9_]+\.log' | sort -u | tr '\n' ' ')"

          fail() {
            echo "ERROR: $*"
            for log in $LOGS; do
              echo "----- tail $log -----"
              tail -n 100 "/work/$log" 2>/dev/null || echo "(missing)"
            done
            sleep infinity
          }

          if [ -z "$LOGS" ]; then
            fail "no '> <name>.log' redirects in $RECIPE_SCRIPT; cannot tell which processes to wait for"
          fi

          echo "=== wait for every worker to report startup ==="
          # Graph capture is slow, and a cold HF cache adds a one-time model
          # download; allow 40 minutes per worker.
          #
          # The FFN worker needs a DIFFERENT marker in every recipe, colocated
          # or disaggregated: it runs purely through the AFD attention<->FFN
          # p2p connector and never serves HTTP, so it never logs "Application
          # startup complete". proxy.log is skipped here -- the proxy prints no
          # startup banner, and the HTTP probe below is its readiness check.
          ready_marker() {
            case "$1" in
              ffn.log) echo "AFD FFN EngineCore started" ;;
              *)       echo "Application startup complete" ;;
            esac
          }
          for log in $LOGS; do
            [ "$log" = "proxy.log" ] && continue
            marker="$(ready_marker "$log")"
            echo "--- waiting on $log (marker: $marker) ---"
            ready=0
            for i in $(seq 1 240); do
              if [ -f "/work/$log" ] && grep -q "$marker" "/work/$log"; then
                echo "$log: ready"
                ready=1
                break
              fi
              if ! kill -0 "$RECIPE_PID" 2>/dev/null; then
                fail "recipe process exited before $log came up"
              fi
              sleep 10
            done
            [ "$ready" = "1" ] || fail "timed out waiting for $log"
          done

          # :18305 is the client endpoint in every recipe, but what answers
          # there differs, and the two do not share a path: the
          # disaggregation proxy serves /healthcheck (not /health), while a
          # colocation attention server serves vLLM's /health (not
          # /healthcheck).
          case " $LOGS " in
            *" proxy.log "*) HEALTH_PATH=/healthcheck; ENDPOINT="proxy" ;;
            *)               HEALTH_PATH=/health;      ENDPOINT="attention server" ;;
          esac

          echo "--- waiting on $ENDPOINT $HEALTH_PATH (127.0.0.1:18305) ---"
          proxy_ready=0
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:18305$HEALTH_PATH" >/dev/null 2>&1; then
              echo "$ENDPOINT: ready"
              proxy_ready=1
              break
            fi
            sleep 5
          done
          [ "$proxy_ready" = "1" ] || fail "$ENDPOINT did not answer $HEALTH_PATH"

          echo "=== stack READY; drive load at 127.0.0.1:18305 ==="
          sleep infinity
      env:
        - name: USER
          value: "vllm"
        - name: HOME
          value: "/work/home"
        - name: MODEL_PATH
          valueFrom:
            configMapKeyRef:
              name: afd-model-config
              key: MODEL_PATH
        - name: HF_HOME
          value: "/models/.hf_home"
        - name: XDG_CACHE_HOME
          value: "/work/xdg"
        - name: TORCHINDUCTOR_CACHE_DIR
          value: "/work/inductor"
        - name: TRITON_CACHE_DIR
          value: "/work/triton"
        - name: VLLM_CACHE_ROOT
          value: "/work/vllm"
        - name: UV_CACHE_DIR
          value: "/work/uv"
        - name: VLLM_LOGGING_LEVEL
          value: "INFO"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token-secret
              key: token
      resources:
        requests:
          nvidia.com/gpu: "${GPU_COUNT}"
          cpu: "16"
          memory: 128Gi
        limits:
          nvidia.com/gpu: "${GPU_COUNT}"
          cpu: "32"
          memory: 200Gi
      volumeMounts:
        - name: model-storage
          mountPath: /models
        - name: dshm
          mountPath: /dev/shm
        - name: work
          mountPath: /work
