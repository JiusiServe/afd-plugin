apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  labels:
    app: afd-recipe
    role: serve
spec:
  selector:
    app: afd-recipe
    role: serve
  ports:
    - name: http
      port: 18305
      targetPort: 18305
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: vllm-route
  labels:
    app: afd-recipe
    role: serve
spec:
  to:
    kind: Service
    name: vllm-service
  port:
    targetPort: http
