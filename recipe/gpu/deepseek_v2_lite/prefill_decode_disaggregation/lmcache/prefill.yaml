# LMCache PD config for the PREFILL producers (GPU0/GPU1) in the 2P1A1F
# prefill/decode-disaggregation topology. Role = sender: KV produced here is
# pushed over NIXL directly into the decode receiver's PD buffer. The receiver
# endpoint is supplied per-request by disagg_proxy_server.py via
# kv_transfer_params["disagg_spec"]; after each push the sender notifies the
# proxy's ZMQ PULL socket at pd_proxy_host:pd_proxy_port.
local_cpu: False
max_local_cpu_size: 0
max_local_disk_size: 0
enable_pd: True
transfer_channel: "nixl"
pd_role: "sender"
pd_proxy_host: "127.0.0.1"
pd_proxy_port: 7500
pd_buffer_size: 1073741824   # 1 GiB staging buffer (sender side)
pd_buffer_device: "cuda"
