# LMCache PD config for the DECODE attention worker (GPU2) in the 2P1A1F
# prefill/decode-disaggregation topology. Role = receiver: it binds the NIXL
# peer listeners (init/alloc ports) that the prefill senders write KV into, and
# serves it from the PD buffer on the next decode request. Only the attention
# worker is a receiver -- the FFN worker (GPU3) holds no KV cache.
#
# pd_peer_init_port / pd_peer_alloc_port are per-TP-rank lists; decode here is
# TP=1, so each is a single-element list. These must match the proxy's
# --decoder-init-port / --decoder-alloc-port.
local_cpu: False
max_local_cpu_size: 0
enable_pd: True
transfer_channel: "nixl"
pd_role: "receiver"
pd_peer_host: "127.0.0.1"
pd_peer_init_port: [7300]
pd_peer_alloc_port: [7400]
pd_buffer_size: 2147483648   # 2 GiB staging buffer (receiver side)
pd_buffer_device: "cuda"
